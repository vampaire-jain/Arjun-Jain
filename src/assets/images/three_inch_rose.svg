<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="roseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E17" />
      <stop offset="50%" stop-color="#2D080E" />
      <stop offset="100%" stop-color="#180407" />
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5A4" />
      <stop offset="40%" stop-color="#E2B755" />
      <stop offset="70%" stop-color="#FCE29F" />
      <stop offset="100%" stop-color="#BE8929" />
    </linearGradient>
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C22744" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#180407" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#roseBg)" rx="24" />
  <circle cx="300" cy="380" r="240" fill="url(#roseGlow)" />
  <rect x="20" y="20" width="560" height="710" fill="none" stroke="url(#goldG)" stroke-width="2.5" rx="16" opacity="0.8" />
  <rect x="30" y="30" width="540" height="690" fill="none" stroke="url(#goldG)" stroke-width="1" rx="12" opacity="0.4" stroke-dasharray="8 4" />

  <!-- Brand Arch Mini Emblem -->
  <g transform="translate(260, 48) scale(0.16)">
    <path d="M 30,570 L 30,250 A 220,220 0 0,1 470,250 L 470,570 Z" fill="#7B4112" stroke="url(#goldG)" stroke-width="14" />
    <path d="M 125,175 C 125,170 130,165 140,165 L 235,165 C 325,165 375,210 375,295 C 375,385 315,425 230,425 L 135,425 Z M 185,215 L 185,375 L 225,375 C 285,375 320,345 320,295 C 320,245 285,215 225,215 Z" fill="url(#goldG)" />
    <polygon points="365,195 470,195 470,228 385,228" fill="url(#goldG)" />
    <polygon points="395,246 470,246 470,279 415,279" fill="url(#goldG)" />
  </g>

  <text x="300" y="165" font-family="'Cinzel', serif" font-size="14" font-weight="600" letter-spacing="4" fill="url(#goldG)" text-anchor="middle">DIVINE FRAGRANCE</text>
  <text x="300" y="185" font-family="'Cinzel', serif" font-size="10" letter-spacing="3" fill="#DDB088" text-anchor="middle">3 INCH SLENDER DHOOP STICKS</text>

  <!-- Title -->
  <text x="300" y="245" font-family="'Playfair Display', serif" font-size="44" font-weight="700" fill="url(#goldG)" text-anchor="middle" letter-spacing="1">ROSE</text>
  <text x="300" y="272" font-family="sans-serif" font-size="12" letter-spacing="3" fill="#F4A6B6" text-anchor="middle">PURE GULAB ESSENCE</text>

  <!-- Illustration: Velvet Rose & Incense Sticks -->
  <g transform="translate(300, 420)">
    <!-- Aura Rings -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#goldG)" stroke-width="1.5" opacity="0.35" />
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#goldG)" stroke-width="0.7" opacity="0.2" stroke-dasharray="6 6" />

    <!-- Stylized Rose Bloom -->
    <path d="M 0,-40 C 35,-40 60,-15 50,20 C 40,55 0,70 0,70 C 0,70 -40,55 -50,20 C -60,-15 -35,-40 0,-40 Z" fill="#991B33" opacity="0.9" />
    <path d="M 0,-25 C 22,-25 38,-8 30,15 C 22,38 0,48 0,48 C 0,48 -22,38 -30,15 C -38,-8 -22,-25 0,-25 Z" fill="#C22744" opacity="0.95" />
    <path d="M 0,-10 C 12,-10 18,0 15,10 C 12,20 0,25 0,25 C 0,25 -12,20 -15,10 C -18,0 -12,-10 0,-10 Z" fill="#E13B5B" />

    <!-- 3 Inch Slender Dhoop Sticks (3 Sticks standing with glowing red ember tip) -->
    <g transform="translate(0, 40)">
      <rect x="-35" y="-120" width="8" height="130" rx="4" fill="#58311B" stroke="url(#goldG)" stroke-width="0.8" />
      <circle cx="-31" cy="-122" r="5" fill="#FF5722" />
      <circle cx="-31" cy="-122" r="3" fill="#FFEB3B" />

      <rect x="-4" y="-135" width="8" height="145" rx="4" fill="#4E2A15" stroke="url(#goldG)" stroke-width="0.8" />
      <circle cx="0" cy="-137" r="6" fill="#FF5722" />
      <circle cx="0" cy="-137" r="3.5" fill="#FFE082" />

      <rect x="27" y="-120" width="8" height="130" rx="4" fill="#58311B" stroke="url(#goldG)" stroke-width="0.8" />
      <circle cx="31" cy="-122" r="5" fill="#FF5722" />
      <circle cx="31" cy="-122" r="3" fill="#FFEB3B" />

      <!-- Sacred Smoke Swirls -->
      <path d="M 0,-140 C -15,-170 20,-200 0,-230 C -20,-260 10,-280 0,-300" fill="none" stroke="#FCE5A4" stroke-width="2.5" opacity="0.6" stroke-linecap="round" />
      <path d="M -31,-125 C -45,-155 -15,-180 -30,-210" fill="none" stroke="#F4A6B6" stroke-width="1.8" opacity="0.45" stroke-linecap="round" />
      <path d="M 31,-125 C 45,-155 15,-180 30,-210" fill="none" stroke="#F4A6B6" stroke-width="1.8" opacity="0.45" stroke-linecap="round" />
    </g>
  </g>

  <!-- Bottom Badge: Length & Authenticity -->
  <g transform="translate(300, 640)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#200609" stroke="url(#goldG)" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Cinzel', serif" font-size="12" font-weight="600" letter-spacing="2" fill="url(#goldG)" text-anchor="middle">3 INCH • BAMBOO-LESS • 100% PURE</text>
  </g>
</svg>

  <text x="300" y="272" font-family="sans-serif" font-size="12" letter-spacing="3" fill="#E8D5B5" text-anchor="middle">BOLD SIGNATURE ROYAL BLEND</text>

  <!-- Illustration: Royal geometric emblem & 3-inch Sticks -->
  <g transform="translate(300, 420)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#goldG)" stroke-width="1.5" opacity="0.35" />
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#goldG)" stroke-width="0.7" opacity="0.2" stroke-dasharray="6 6" />

    <!-- Diamond emblem -->
    <polygon points="0,-70 50,0 0,70 -50,0" fill="none" stroke="url(#goldG)" stroke-width="2" opacity="0.7" />
    <polygon points="0,-50 35,0 0,50 -35,0" fill="none" stroke="url(#goldG)" stroke-width="1" opacity="0.4" />

    <!-- 3-inch Dhoop Sticks -->
    <g transform="translate(0, 45)">
      <rect x="-35" y="-120" width="8" height="130" rx="4" fill="#3D3023" stroke="url(#goldG)" stroke-width="0.8" />
      <circle cx="-31" cy="-122" r="5" fill="#FF5722" />
      <circle cx="-31" cy="-122" r="3" fill="#FFEB3B" />

      <rect x="-4" y="-135" width="8" height="145" rx="4" fill="#2E2316" stroke="url(#goldG)" stroke-width="0.8" />
      <circle cx="0" cy="-137" r="6" fill="#FF5722" />
      <circle cx="0" cy="-137" r="3.5" fill="#FFE082" />

      <rect x="27" y="-120" width="8" height="130" rx="4" fill="#3D3023" stroke="url(#goldG)" stroke-width="0.8" />
      <circle cx="31" cy="-122" r="5" fill="#FF5722" />
      <circle cx="31" cy="-122" r="3" fill="#FFEB3B" />

      <path d="M 0,-140 C -15,-170 20,-200 0,-230 C -20,-260 10,-280 0,-300" fill="none" stroke="#FFF0BE" stroke-width="2.5" opacity="0.7" stroke-linecap="round" />
      <path d="M -31,-125 C -45,-155 -15,-180 -30,-210" fill="none" stroke="#E5BE64" stroke-width="1.8" opacity="0.5" stroke-linecap="round" />
      <path d="M 31,-125 C 45,-155 15,-180 30,-210" fill="none" stroke="#E5BE64" stroke-width="1.8" opacity="0.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(300, 640)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#15120D" stroke="url(#goldG)" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Cinzel', serif" font-size="12" font-weight="600" letter-spacing="2" fill="url(#goldG)" text-anchor="middle">3 INCH • BAMBOO-LESS • 100% PURE</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="gcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1A14" />
      <stop offset="50%" stop-color="#120E0A" />
      <stop offset="100%" stop-color="#080705" />
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0BE" />
      <stop offset="35%" stop-color="#E5BE64" />
      <stop offset="70%" stop-color="#FFE8A3" />
      <stop offset="100%" stop-color="#C59635" />
    </linearGradient>
    <radialGradient id="gcGlow" cx="50%" cy="50%" r="50%">

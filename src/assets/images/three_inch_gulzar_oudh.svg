<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="oudhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A1728" />
      <stop offset="50%" stop-color="#210B16" />
      <stop offset="100%" stop-color="#10030A" />
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5A4" />
      <stop offset="40%" stop-color="#E2B755" />
      <stop offset="70%" stop-color="#FCE29F" />
      <stop offset="100%" stop-color="#BE8929" />
    </linearGradient>
    <radialGradient id="oudhGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9C2C64" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10030A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#oudhBg)" rx="24" />
  <circle cx="300" cy="380" r="240" fill="url(#oudhGlow)" />
  <rect x="20" y="20" width="560" height="710" fill="none" stroke="url(#goldG)" stroke-width="2.5" rx="16" opacity="0.8" />
  <rect x="30" y="30" width="540" height="690" fill="none" stroke="url(#goldG)" stroke-width="1" rx="12" opacity="0.4" stroke-dasharray="8 4" />

  <!-- Brand Arch Mini Emblem -->
  <g transform="translate(260, 48) scale(0.16)">
    <path d="M 30,570 L 30,250 A 220,220 0 0,1 470,250 L 470,570 Z" fill="#7B4112" stroke="url(#goldG)" stroke-width="14" />
    <path d="M 125,175 C 125,170 130,165 140,165 L 235,165 C 325,165 375,210 375,295 C 375,385 315,425 230,425 L 135,425 Z M 185,215 L 185,375 L 225,375 C 285,375 320,345 320,295 C 320,245 285,215 225,215 Z" fill="url(#goldG)" />
    <polygon points="365,195 470,195 470,228 385,228" fill="url(#goldG)" />
    <polygon points="395,246 470,246 470,279 415,279" fill="url(#goldG)" />
  </g>

  <text x="300" y="165" font-family="'Cinzel', serif" font-size="14" font-weight="600" letter-spacing="4" fill="url(#goldG)" text-anchor="middle">DIVINE FRAGRANCE</text>
  <text x="300" y="185" font-family="'Cinzel', serif" font-size="10" letter-spacing="3" fill="#E8B8D0" text-anchor="middle">3 INCH SLENDER DHOOP STICKS</text>


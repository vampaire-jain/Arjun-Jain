  <text x="300" y="245" font-family="'Playfair Display', serif" font-size="40" font-weight="700" fill="url(#goldG)" text-anchor="middle" letter-spacing="1">GULZAR OUDH</text>
  <text x="300" y="272" font-family="sans-serif" font-size="12" letter-spacing="3" fill="#FAD1E6" text-anchor="middle">ROYAL AGARWOOD &amp; FLORALS</text>

  <!-- Illustration: Arabesque Floral & Oudh Sticks -->
  <g transform="translate(300, 420)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#goldG)" stroke-width="1.5" opacity="0.35" />
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#goldG)" stroke-width="0.7" opacity="0.2" stroke-dasharray="6 6" />

    <!-- Arabesque decorative motif -->
    <path d="M 0,-60 C 25,-40 25,-10 0,10 C -25,-10 -25,-40 0,-60 Z" fill="none" stroke="url(#goldG)" stroke-width="1.8" opacity="0.6" />
    <path d="M -60,0 C -40,25 -10,25 10,0 C -10,-25 -40,-25 -60,0 Z" fill="none" stroke="url(#goldG)" stroke-width="1.2" opacity="0.4" />
    <path d="M 60,0 C 40,25 10,25 -10,0 C 10,-25 40,-25 60,0 Z" fill="none" stroke="url(#goldG)" stroke-width="1.2" opacity="0.4" />

    <!-- 3-inch Dhoop Sticks -->
    <g transform="translate(0, 45)">
      <rect x="-35" y="-120" width="8" height="130" rx="4" fill="#3A1C2C" stroke="url(#goldG)" stroke-width="0.8" />
      <circle cx="-31" cy="-122" r="5" fill="#FF5722" />
      <circle cx="-31" cy="-122" r="3" fill="#FFEB3B" />

      <rect x="-4" y="-135" width="8" height="145" rx="4" fill="#2E1422" stroke="url(#goldG)" stroke-width="0.8" />
      <circle cx="0" cy="-137" r="6" fill="#FF5722" />
      <circle cx="0" cy="-137" r="3.5" fill="#FFE082" />

      <rect x="27" y="-120" width="8" height="130" rx="4" fill="#3A1C2C" stroke="url(#goldG)" stroke-width="0.8" />
      <circle cx="31" cy="-122" r="5" fill="#FF5722" />
      <circle cx="31" cy="-122" r="3" fill="#FFEB3B" />

      <path d="M 0,-140 C -15,-170 20,-200 0,-230 C -20,-260 10,-280 0,-300" fill="none" stroke="#FCE5A4" stroke-width="2.5" opacity="0.7" stroke-linecap="round" />
      <path d="M -31,-125 C -45,-155 -15,-180 -30,-210" fill="none" stroke="#FAD1E6" stroke-width="1.8" opacity="0.5" stroke-linecap="round" />
      <path d="M 31,-125 C 45,-155 15,-180 30,-210" fill="none" stroke="#FAD1E6" stroke-width="1.8" opacity="0.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(300, 640)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#240A18" stroke="url(#goldG)" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Cinzel', serif" font-size="12" font-weight="600" letter-spacing="2" fill="url(#goldG)" text-anchor="middle">3 INCH • BAMBOO-LESS • 100% PURE</text>

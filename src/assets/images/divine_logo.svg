<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <!-- Rich Golden Gradient -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5A4" />
      <stop offset="30%" stop-color="#E2B755" />
      <stop offset="60%" stop-color="#FCE29F" />
      <stop offset="85%" stop-color="#BE8929" />
      <stop offset="100%" stop-color="#F2D179" />
    </linearGradient>

    <!-- Warm Sandalwood Incense Brown Background -->
    <linearGradient id="archBrownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8C4E17" />
      <stop offset="50%" stop-color="#7B4112" />
      <stop offset="100%" stop-color="#67340D" />
    </linearGradient>

    <!-- Soft Inner Glow -->
    <radialGradient id="archGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#B26C24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#67340D" stop-opacity="0" />
    </radialGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="goldEmboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#3A1C04" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Arch Shield with drop shadow -->
  <g filter="url(#softShadow)">
    <!-- Main Arch Background Path -->
    <!-- Width: 460 (20 to 480), Height: 560 (20 to 580). Dome radius: 230 -->
    <path
      d="M 30,570 
         L 30,250 
         A 220,220 0 0,1 470,250 
         L 470,570 
         Z"
      fill="url(#archBrownGrad)"
    />

    <!-- Ambient Radial Glow Overlay -->
    <path
      d="M 30,570 
         L 30,250 
         A 220,220 0 0,1 470,250 
         L 470,570 
         Z"
      fill="url(#archGlow)"
    />

    <!-- Outer Gold Border (thick rim) -->
    <path
      d="M 30,570 
         L 30,250 
         A 220,220 0 0,1 470,250 
         L 470,570 
         Z"
      fill="none"
      stroke="url(#goldLinear)"
      stroke-width="14"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Inner Thin Gold Frame -->
    <path
      d="M 44,556 
         L 44,250 
         A 206,206 0 0,1 456,250 
         L 456,556 
         Z"
      fill="none"
      stroke="url(#goldLinear)"
      stroke-width="3.5"
      stroke-opacity="0.95"
    />
  </g>

  <!-- Golden D Monogram & Winged Accents -->
  <g filter="url(#goldEmboss)">
    <!-- Stylized Letter "D" -->
    <!-- Smooth elegant D shape with outer curve and inner counter -->
    <path
      d="M 125,175
         C 125,170 130,165 140,165
         L 235,165
         C 325,165 375,210 375,295
         C 375,385 315,425 230,425
         L 135,425
         C 125,425 125,420 125,415
         L 125,175
         Z
         M 185,215
         L 185,375
         L 225,375
         C 285,375 320,345 320,295
         C 320,245 285,215 225,215
         Z"
      fill="url(#goldLinear)"
    />

    <!-- Upper Wing Bar Accent on the Right (=) -->
    <!-- Angled cut on left, horizontal bar on right -->
    <polygon
      points="365,195 470,195 470,228 385,228"
      fill="url(#goldLinear)"
    />

    <!-- Lower Wing Bar Accent on the Right (=) -->
    <polygon
      points="395,246 470,246 470,279 415,279"
      fill="url(#goldLinear)"
    />
  </g>

  <!-- Typography: "Divine Fragrance" -->
  <g filter="url(#goldEmboss)">
    <text
      x="250"
      y="495"
      font-family="'Cinzel', 'Playfair Display', 'Baskerville', 'Georgia', serif"
      font-size="44"
      font-weight="700"
      letter-spacing="1.5"
      text-anchor="middle"
      fill="url(#goldLinear)"
    >Divine Fragrance</text>
  </g>
</svg>
